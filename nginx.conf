events {}
http {
    server {
        listen 8080;
        absolute_redirect off;
        port_in_redirect off;
        
        # Render Health Check (so Render doesn't crash the app)
        location /ping {
            return 200 "OK";
        }
        
        location /healthz {
            return 200 "OK";
        }

        # Catch-all fake server error (for stealth/security)
        location / {
            return 500 "Internal Server Error";
        }
        
        # Secret path for Panel
        location /apm/ {
            proxy_pass http://127.0.0.1:8083/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location = /apm {
            return 302 /apm/;
        }

        # Panel APIs (needed for panel to work)
        location /api/ {
            proxy_pass http://127.0.0.1:8083/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 1. API ROUTE
        location /v1/ {
            proxy_pass http://127.0.0.1:8085/v1/;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
        }

        # Handle incorrectly joined URLs (missing /v1/)
        location /chat/completions {
            proxy_pass http://127.0.0.1:8085/v1/chat/completions;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
        }
        
        # Handle v1chat/completions
        location /v1chat/completions {
            proxy_pass http://127.0.0.1:8085/v1/chat/completions;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
        }

        # 2. ROUTER PANEL
        location /router/ {
            proxy_pass http://127.0.0.1:8085/;
            proxy_set_header Host $host;
        }

        # 3. SECURE LOGS
        location /logs {
            proxy_pass http://127.0.0.1:8085/logs;
            proxy_set_header Host $host;
        }
    }
}
