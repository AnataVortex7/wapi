events {}
http {
    server {
        listen 8080;
        absolute_redirect off;
        port_in_redirect off;
        
        # Render Health Check (so Render doesn't crash the app)
        location /ping {
            return 200 "OK";
        }
        
        location /healthz {
            return 200 "OK";
        }

        # Catch-all fake server error (for stealth/security)
        location / {
            return 500 "Internal Server Error";
        }
        
        # Secret path for Panel
        location /apm/ {
            proxy_pass http://127.0.0.1:8083/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location = /apm {
            return 302 /apm/;
        }

        # Panel APIs (needed for panel to work)
        location /api/ {
            proxy_pass http://127.0.0.1:8083/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Gemini API (v1)
        location /v1/ {
            # Security: Require exact API Key (ignore for CORS OPTIONS requests)
            set $auth_failed 0;
            if ($request_method != 'OPTIONS') {
                set $auth_failed 1;
            }
            # Use regex match to ignore cases or extra spaces in "Bearer"
            if ($http_authorization ~* "Swapnpurti@1181") {
                set $auth_failed 0;
            }
            if ($auth_failed = 1) {
                return 401 '{"error": {"message": "Unauthorized: Invalid or missing API Key. Received: [$http_authorization]", "type": "invalid_request_error"}}';
            }

            proxy_pass http://127.0.0.1:8081/v1/;
            proxy_set_header Host $host;
            
            # Enable Streaming (crucial for Gemini SSE)
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }
    }
}
